[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bibi-backend"
version = "0.1.0"
description = "Bibi backend: FastAPI modular monolith"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn[standard]==0.54.0",
  "sqlalchemy==2.1.6",
  "psycopg[binary]==3.3.7",
  "psycopg-pool==3.3.3",
  "alembic==1.20.1",
  "pydantic-settings==2.16.2",
  "email-validator==2.3.0",
  "pgvector==0.5.1",
  "arq==0.28.0",
  "redis==5.3.1",
  "langgraph==1.2.19",
  "langgraph-checkpoint-postgres==3.2.0",
  "pyjwt==2.15.1",
  "argon2-cffi==25.1.0",
  "python-multipart==0.0.33",
  "httpx==0.28.1",
  "anthropic==2.4.0",
  "sentry-sdk==2.73.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.2.0",
  "ruff==0.17.3",
  "mypy==2.4.1",
  "import-linter==2.15",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
packages = ["app"]
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
