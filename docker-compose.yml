# Local development stack. Studio runs outside Docker with `pnpm studio:dev`.
x-backend: &backend
  build: ./backend
  env_file: ./backend/.env
  environment:
    BIBI_DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/bibi
    BIBI_REDIS_URL: redis://redis:6379
    BIBI_QUEUE_BACKEND: arq
    BIBI_STORAGE_DIR: /app/var/storage
  volumes:
    - storage:/app/var/storage
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bibi
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    <<: *backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker-default:
    <<: *backend
    command: ["arq", "app.worker.DefaultWorker"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker-drafting:
    <<: *backend
    command: ["arq", "app.worker.DraftingWorker"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker-voice:
    <<: *backend
    command: ["arq", "app.worker.VoiceWorker"]
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  storage:
